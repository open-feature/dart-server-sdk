name: Coverage Workflow

on:
  workflow_call:

jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          dart test --coverage=coverage

      - name: Generate LCOV report
        run: |
          dart run coverage:format_coverage \
            --in=coverage \
            --out=coverage/lcov.info \
            --lcov \
            --report-on=lib \
            --packages=.dart_tool/package_config.json

      - name: List coverage files
        run: ls -al coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/lcov.info

  upload-coverage:
    runs-on: ubuntu-latest
    needs: test-and-upload
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: coverage

      - name: List coverage files after download
        run: ls -al coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV__UPLOAD_TOKEN }} # omit for public repos if you want
          slug: open-feature/dart-server-sdk
          files: coverage/lcov.info

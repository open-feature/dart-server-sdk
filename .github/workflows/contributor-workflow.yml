# This workflow analyzes each Dart package.

name: Contributor Workflow

on:
  workflow_call: # Makes the workflow reusable

jobs:
  analyze-package:
    name: Analyze ${{ matrix.package.name }} package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: server
            path: .
          - name: client
            path: packages/openfeature_dart_client_sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        # with:
        #   sdk: stable   # (optional; stable is the default)

      - name: Install Dependencies
        working-directory: ${{ matrix.package.path }}
        run: |
          echo "Installing dependencies for ${{ matrix.package.name }} SDK..."
          dart pub get

      - name: Check for Outdated Dependencies
        working-directory: ${{ matrix.package.path }}
        run: |
          echo "Checking for outdated dependencies..."
          dart pub outdated || true

      - name: Verify Dart Formatting
        working-directory: ${{ matrix.package.path }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Validate publication archive
        working-directory: ${{ matrix.package.path }}
        env:
          PACKAGE_PATH: ${{ matrix.package.path }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=0
          set +e
          if [[ "$PACKAGE_PATH" == "." ]]; then
            PUBLISH_OUTPUT=$(dart pub publish --dry-run 2>&1)
            STATUS=$?
          else
            PUBLISH_OUTPUT=$(dart ../../tool/stage_client_package.dart --dry-run 2>&1)
            STATUS=$?
          fi
          set -e
          echo "$PUBLISH_OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            exit "$STATUS"
          fi
          if [[ "$PACKAGE_PATH" == "." ]] && grep -q "packages/openfeature_dart_client_sdk" <<< "$PUBLISH_OUTPUT"; then
            echo "The server package archive contains client package files." >&2
            exit 1
          fi

      - name: Compile client web smoke target
        if: matrix.package.name == 'client'
        working-directory: ${{ matrix.package.path }}
        run: dart compile js test/web_compile_smoke.dart -o build/web_compile_smoke.js

      - name: Run Static Analysis (capture and show)
        id: analyze
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          set -o pipefail
          echo "Running static analysis for core SDK..."
          set +e
          { dart analyze | tee analysis_report.txt; } 2> >(tee error_log.txt >&2)
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Categorize and Count Analysis Results
        if: always()
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          echo "Categorizing analysis results..."
          touch analysis_report.txt error_log.txt
          # Create categorized files (empty if none)
          grep -i "info"    analysis_report.txt > info_report.txt    || true
          grep -i "warning" analysis_report.txt > warning_report.txt || true
          grep -i "error"   analysis_report.txt > error_report.txt   || true

          INFO_COUNT=$(wc -l < info_report.txt || echo 0)
          WARNING_COUNT=$(wc -l < warning_report.txt || echo 0)
          ERROR_COUNT=$(wc -l < error_report.txt || echo 0)

          echo ""
          echo "Summary of analysis results:"
          echo "Informational messages: $INFO_COUNT"
          echo "Warnings: $WARNING_COUNT"
          echo "Errors: $ERROR_COUNT"
          echo ""

          if [[ $WARNING_COUNT -gt 0 ]]; then
            echo "Warnings (first 200 lines):"
            sed -n '1,200p' warning_report.txt
          fi

          if [[ $ERROR_COUNT -gt 0 ]]; then
            echo ""
            echo "Errors (first 200 lines):"
            sed -n '1,200p' error_report.txt
          fi

      - name: Identify Specific Commits for Issues
        if: always()
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          echo "Identifying specific commits for files mentioned by analyzer..."
          # Collect .dart file paths mentioned by analyzer; tolerate empty sets
          FILES=$(awk -F: '{print $1}' analysis_report.txt | grep -E '\.dart$' | sort -u || true)

          if [[ -z "$FILES" ]]; then
            echo "No files with issues were reported by the analyzer."
            exit 0
          fi

          for file in $FILES; do
            if [[ -f "$file" ]]; then
              git_log=$(git -C "$GITHUB_WORKSPACE" log -n 1 --pretty=format:"%h by %an <%ae>" -- "$file" || true)
              echo "File: $file"
              echo "Last change: ${git_log:-unknown}"
              echo ""
            fi
          done

      - name: Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package.name }}-sdk-analysis
          path: |
            ${{ matrix.package.path }}/analysis_report.txt
            ${{ matrix.package.path }}/error_log.txt
            ${{ matrix.package.path }}/info_report.txt
            ${{ matrix.package.path }}/warning_report.txt
            ${{ matrix.package.path }}/error_report.txt
          retention-days: 7

      # Fail the job if the analyzer actually failed.
      - name: Fail if analyzer failed
        if: ${{ always() && steps.analyze.outputs.status != '0' }}
        run: |
          echo "Failing job because the analyzer returned a non-zero exit code."
          exit 1

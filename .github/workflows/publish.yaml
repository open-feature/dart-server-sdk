name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Server tag: v{{version}}
      - 'openfeature_dart_client_sdk-v[0-9]+.[0-9]+.[0-9]+'
      - 'openfeature_dart_client_sdk-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      - name: Select package
        id: package
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^openfeature_dart_client_sdk-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "directory=packages/openfeature_dart_client_sdk" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "directory=packages/openfeature_dart_server_sdk" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported publication tag: $TAG_NAME" >&2
            exit 64
          fi
      - name: Validate tag against package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          dart tool/validate_publish_tag.dart
          --tag "$TAG_NAME"
          --package "${{ steps.package.outputs.directory }}"
      - name: Install dependencies
        working-directory: ${{ steps.package.outputs.directory }}
        run: dart pub get
      - name: Publish
        if: ${{ !startsWith(github.ref_name, 'openfeature_dart_client_sdk-v') }}
        working-directory: ${{ steps.package.outputs.directory }}
        run: dart pub publish --force
      - name: Publish client package
        if: >-
          ${{ startsWith(github.ref_name, 'openfeature_dart_client_sdk-v') &&
              vars.CLIENT_PUBDEV_BOOTSTRAPPED == 'true' }}
        run: dart tool/stage_client_package.dart --publish
      - name: Explain first client publication
        if: >-
          ${{ startsWith(github.ref_name, 'openfeature_dart_client_sdk-v') &&
              vars.CLIENT_PUBDEV_BOOTSTRAPPED != 'true' }}
        run: |
          echo "Client publishing is disabled until the first manual pub.dev bootstrap is complete."
          echo "Follow doc/client-sdk-release.md, then set CLIENT_PUBDEV_BOOTSTRAPPED=true."

# This parent pipeline only runs and routes to the correct child workflow after validation checks.

name: Parent Pipeline

on:
  push:
    branches:
      - main
      - development

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-validation:
    name: Trigger Validation Workflow
    # A development -> main promotion already has same-SHA push validation.
    # Skip only that duplicate PR event; all contributor PRs still run here.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'development' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/validation-workflow.yml
    with:
      branch_name: ${{ github.head_ref || github.ref_name }}

  trigger-coverage:
    name: Trigger Coverage Workflow
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'development' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/coverage-workflow.yml

  contributor-workflow:
    name: Trigger Contributor Workflow
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'development' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/contributor-workflow.yml

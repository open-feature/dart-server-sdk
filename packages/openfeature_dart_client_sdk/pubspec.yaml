name: openfeature_dart_client_sdk
description: Official static-context Dart client SDK for OpenFeature.
version: 0.0.1-beta.1 # x-release-please-version
homepage: https://github.com/open-feature/dart-sdk
repository: https://github.com/open-feature/dart-sdk
issue_tracker: https://github.com/open-feature/dart-sdk/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

dev_dependencies:
  # Keep the lower bounds compatible with the package's minimum Dart SDK.
  analyzer: '>=7.5.4 <9.0.0'
  coverage: ^1.15.0
  # Dart 3 requires the SDK-layout-aware frontend server client.
  frontend_server_client: ^4.0.0
  lints: '>=5.0.0 <7.0.0'
  # Keep the Chrome test runner on the two-argument connection callback API.
  shelf_web_socket: ^2.0.1
  test: ^1.26.3
